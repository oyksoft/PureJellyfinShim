[package]
name = "PureJellyfinShim"
version = "1.5.7"
description = "PureJellyfinShim - A cast receiver for Jellyfin that controls external MPV"
authors = ["oyksoft"]
license = "MIT"
repository = "https://github.com/oyksoft/PureJellyfinShim"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "purejellyfinshim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
specta-typescript = "0.0.12"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
base64 = "0.22.1"
sha2 = "0.10.9"
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2.9.0"
specta = "=2.0.0-rc.25"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
thiserror = "2.0.18"
parking_lot = "0.12.5"
async-channel = "2.5.0"
which = "8.0.2"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
futures-util = "0.3.32"
tauri-plugin-store = "2.4.3"
dirs = "6.0.0"
tokio-util = { version = "0.7.18", features = ["io"] }
reqwest = { version = "0.13.3", features = ["json", "query", "rustls", "stream"] }
axum = "0.8.9"
bytes = "1.11.1"
fs2 = "0.4.3"
hls_m3u8 = "0.5.1"
url = "2.5.8"
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[features]
webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

# Release profile optimizations - reduce binary size while keeping startup fast
[profile.release]
lto = "thin"        # thin = 比 fat 快很多，体积略大但仍优化
codegen-units = 16  # 16 个并行单元，充分利用多核
panic = "abort"
strip = true
incremental = false
