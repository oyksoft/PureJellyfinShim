name: Build and Release
on:
  push:
    tags:
      - 'pure-v*.*.*' # Triggers only on tags like pure-v1.0.0, pure-v1.5.8

jobs:
  changelog:
    name: Load Local Agent Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.release-notes.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4

      - name: Load local agent release notes
        id: release-notes
        env:
          BODY_FILE: .github/release-notes/${{ github.ref_name }}.md
          DELIMITER: RELEASE_NOTES_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          if [ ! -s "$BODY_FILE" ]; then
            echo "::error::Missing local-agent release notes at $BODY_FILE"
            exit 1
          fi
          IFS= read -r first_line < "$BODY_FILE"
          if [ "$first_line" != "## $GITHUB_REF_NAME" ]; then
            echo "::error::$BODY_FILE must start with an exact '## $GITHUB_REF_NAME' heading"
            exit 1
          fi
          # Write the multi-line release body to $GITHUB_OUTPUT using the
          # documented `name<<delimiter ... delimiter` format. We explicitly
          # bracket the body and the trailing delimiter with `printf` so the
          # parser sees them on their own lines regardless of whether the
          # body file ends with a newline.
          {
            printf 'release_body<<%s\n' "$DELIMITER"
            cat "$BODY_FILE"
            printf '\n%s\n' "$DELIMITER"
          } >> "$GITHUB_OUTPUT"
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build Application
        run: bun tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Create Release
    needs: [changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PureJellyfinShim ${{ github.ref_name | replace: 'pure-', '' }}
          body: ${{ needs.changelog.outputs.release_body }}
          files: artifacts/**/*
          prerelease: ${{ contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}